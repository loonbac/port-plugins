[workspace]
resolver = "2"
# `plugins/*` son los instalables externos (binario propio, solo el SDK).
# `in-process/*` son los que necesitan recompilar PORT porque usan features en
# proceso (GPUI, hooks en caliente, protocolo de cierre).
members = [
    "plugins/*",
    "in-process/*",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
gpui = "=0.2.2"
serde_json = "1"
# Fijado al tag: sin esto, una build toma el último master, que puede no
# coincidir con la API y romper la compilación sin aviso.
port-term-core = { git = "https://github.com/loonbac/port.git", tag = "v0.1.4" }
port-plugin-api = { git = "https://github.com/loonbac/port.git", tag = "v0.1.4" }
# SDK de los plugins que corren como proceso independiente: solo declara el
# protocolo y el bucle de stdio. Se fija al tag igual que la API in-process.
port-plugin-sdk = { git = "https://github.com/loonbac/port.git", tag = "v0.1.4" }

[patch."https://github.com/loonbac/port.git"]
port-term-core = { path = "../port/crates/term-core" }
port-plugin-api = { path = "../port/crates/plugin-api" }
