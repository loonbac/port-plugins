[workspace]
resolver = "2"
members = [
    "plugins/transparency",
    "plugins/font",
    "plugins/font-zoom",
    "plugins/shortcuts",
    "plugins/herdr",
    "plugins/close-guard",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
gpui = "=0.2.2"
serde_json = "1"
# Fijado al tag: sin esto, una build toma el último master, que puede no
# coincidir con la API y romper la compilación sin aviso.
port-term-core = { git = "https://github.com/loonbac/port.git", tag = "v0.1.3" }
port-plugin-api = { git = "https://github.com/loonbac/port.git", tag = "v0.1.3" }

[patch."https://github.com/loonbac/port.git"]
port-term-core = { path = "../port/crates/term-core" }
port-plugin-api = { path = "../port/crates/plugin-api" }
