# Raíz de workspace propia a propósito: este CLI no comparte dependencias con el
# resto del repositorio y el paquete de PORT lo construye desde su fuente, así
# que no puede depender de `[workspace.package]` ni del `[patch]` que el
# workspace raíz usa para el desarrollo local.
[workspace]

[package]
name = "port-herdr"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reemplazo liviano de la CLI de herdr para interceptar llamadas de metadatos"

[[bin]]
name = "port-herdr"
path = "src/main.rs"

[dependencies]
serde_json = "1"
