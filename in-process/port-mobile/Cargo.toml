[package]
name = "port-plugin-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cliente móvil de PORT: sirve la PWA y habla el protocolo remoto"

[lib]
name = "port_plugin_mobile"
path = "src/lib.rs"

[dependencies]
port-term-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
# Sólo el protocolo, sin TLS: la única superficie es localhost y el TLS lo pone
# `tailscale serve`. La feature `handshake` es la que trae `accept` y el apretón
# de manos completo; sin ella no hay servidor de WebSocket.
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
